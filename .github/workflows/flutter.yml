name: Flutter Android

on:
  pull_request:
    paths:
      - 'APP_MOVIL_CISTERNAS/flutter_app/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'APP_MOVIL_CISTERNAS/flutter_app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: APP_MOVIL_CISTERNAS/flutter_app
        shell: bash
    env:
      FLUTTER_VERSION: '3.47.7'
      FLUTTER_COMMIT: abaf9c523780a608bd46686fd5e53740a07077f8
      # Optional repository variable. Set only after deploying the backend.
      MOBILE_API_URL: ${{ vars.MOBILE_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the tested official Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Verify the configured API
        if: env.MOBILE_API_URL != ''
        shell: pwsh
        run: ./tool/check_api.ps1 -ApiUrl $env:MOBILE_API_URL

      - name: Build Android ARM64 debug APK
        run: |
          build_args=(--debug --no-pub --target-platform android-arm64 --split-per-abi)
          if [[ -n "$MOBILE_API_URL" ]]; then
            build_args+=("--dart-define=API_URL=$MOBILE_API_URL")
          fi
          flutter build apk "${build_args[@]}"

      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scpe-cisternas-android-arm64-debug
          path: APP_MOVIL_CISTERNAS/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
